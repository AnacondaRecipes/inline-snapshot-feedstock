{% set name = "inline-snapshot" %}
{% set version = "0.36.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/0e/80/13c7576e62fd189e9ff86a18e32a9bfcc04189baee617eef5f647df44a0f/inline_snapshot-0.36.1.tar.gz
  sha256: ff57828c691eaafe03426de25f2c21a1e382905dcbe110934df862297e8c5f8a

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - asttokens >=2.0.5
    - executing >=2.2.0
    - rich >=13.7.1
    - tomli >=2.0.0  # [py<311]
    - pytest >=8.3.4
    - typing-extensions
  run_constrained:
    - black >=23.3.0
    - dirty-equals >=0.9.0

